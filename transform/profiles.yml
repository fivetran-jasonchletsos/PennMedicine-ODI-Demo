# ============================================================
# dbt profile for the Healthcare EPIC Databricks demo.
#
# Reads credentials from environment so secrets never live in repo.
# Set these locally or as repo secrets in GitHub Actions:
#
#   DATABRICKS_HOST         e.g. dbc-abc12345-6789.cloud.databricks.com
#   DATABRICKS_HTTP_PATH    e.g. /sql/1.0/warehouses/abc123def456
#   DATABRICKS_TOKEN        Databricks personal access token
#   DATABRICKS_CATALOG      default: jason_chletsos_pennmed
# ============================================================

healthcare_clarity:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'jason_chletsos_pennmed') }}"
      schema: jason_chletsos_pennmed_staging  # Default target schema
      threads: 4

    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'jason_chletsos_pennmed') }}"
      schema: jason_chletsos_pennmed_staging
      threads: 8
