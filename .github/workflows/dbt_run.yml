name: dbt Run — Post Fivetran Sync (Databricks)

on:
  schedule:
    - cron: "55 2,8,14,20 * * *"
  workflow_dispatch:

jobs:
  dbt_run:
    name: Run dbt models on Databricks
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: ./transform
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install "dbt-core==1.8.9" "dbt-databricks==1.8.6"

      - working-directory: transform
        run: dbt deps --profiles-dir .

      - working-directory: transform
        run: dbt run --profiles-dir . --target dev

      - working-directory: transform
        run: dbt test --profiles-dir . --target dev
        continue-on-error: true
